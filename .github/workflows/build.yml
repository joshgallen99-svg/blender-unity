name: Test and build WebGL

on:
  push:
    branches: ['**', '!webgl-build']
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Skip if Unity secrets are missing
        id: check
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ]; then
            echo "Unity secrets not set yet - see README. Skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
        with:
          lfs: true

      - uses: actions/cache@v4
        if: steps.check.outputs.ok == 'true'
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - name: Run tests
        if: steps.check.outputs.ok == 'true'
        uses: game-ci/unity-test-runner@v4
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Build WebGL
        if: steps.check.outputs.ok == 'true'
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: WebGL
          buildMethod: BuildScript.BuildWebGL
          buildName: WebGL
          versioning: None
          allowDirtyBuild: true
        env:
          BUILD_PATH: build/WebGL/WebGL

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ok == 'true'
        with:
          name: WebGL
          path: build/WebGL
          retention-days: 14

      - name: Publish build to webgl-build branch (for cloud playtesting)
        if: steps.check.outputs.ok == 'true' && github.ref == 'refs/heads/main'
        run: |
          cd build/WebGL/WebGL
          git init -q -b webgl-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "WebGL build of ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" webgl-build
