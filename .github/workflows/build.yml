name: Test and build WebGL

on:
  push:
    branches: ['**', '!webgl-build', '!unity-refs']
  workflow_dispatch:
    inputs:
      export_refs:
        description: 'Also export Unity reference DLLs to the unity-refs branch'
        type: boolean
        default: false

permissions:
  contents: write
  checks: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Skip if Unity secrets are missing
        id: check
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ]; then
            echo "Unity secrets not set yet - see README. Skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
        with:
          lfs: true

      - uses: actions/cache@v4
        if: steps.check.outputs.ok == 'true'
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - name: Run tests
        if: steps.check.outputs.ok == 'true'
        uses: game-ci/unity-test-runner@v4
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Build WebGL
        if: steps.check.outputs.ok == 'true'
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: WebGL
          buildMethod: BuildScript.BuildWebGL
          buildName: WebGL
          versioning: None
          allowDirtyBuild: true
        env:
          BUILD_PATH: build/WebGL/WebGL

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ok == 'true'
        with:
          name: WebGL
          path: build/WebGL
          retention-days: 14

      - name: Publish build to webgl-build branch (for cloud playtesting)
        if: steps.check.outputs.ok == 'true' && github.ref == 'refs/heads/main'
        run: |
          INDEX=$(sudo find build -name index.html | head -1)
          echo "Found build at: $INDEX"
          OUT="$RUNNER_TEMP/webgl"
          mkdir -p "$OUT" && sudo cp -r "$(dirname "$INDEX")"/. "$OUT"/ && sudo chown -R "$(id -u)" "$OUT"
          cd "$OUT"
          git init -q -b webgl-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "WebGL build of ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" webgl-build

      - name: Export Unity reference DLLs to unity-refs branch (for offline compile checks)
        if: steps.check.outputs.ok == 'true' && inputs.export_refs
        run: |
          OUT="$RUNNER_TEMP/refs"; mkdir -p "$OUT/Editor" "$OUT/ScriptAssemblies" "$OUT/PackageCache"
          IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep unityci/editor | head -1)
          echo "Using image $IMAGE"
          docker run --rm -v "$OUT/Editor:/out" "$IMAGE" bash -c '
            cd /opt/unity/Editor/Data
            find Managed NetStandard MonoBleedingEdge/lib/mono/4.7.1-api -name "*.dll" -size -90M | tar -cf - -T - | tar -xf - -C /out'
          sudo cp Library/ScriptAssemblies/*.dll "$OUT/ScriptAssemblies/" || true
          sudo cp -r Library/PackageCache/. "$OUT/PackageCache/"
          sudo find "$OUT/PackageCache" -type f \( -name "*.png" -o -name "*.psd" -o -name "*.tga" -o -name "*.exr" -o -name "*.hdr" -o -name "*.fbx" -o -name "*.asset" -o -name "*.mat" \) -delete
          sudo find "$OUT/PackageCache" -type d \( -name "Documentation~" -o -name "Samples~" -o -name "Tests" \) -prune -exec rm -rf {} +
          mkdir -p "$OUT/ProjectSettings" && sudo cp ProjectSettings/*.asset "$OUT/ProjectSettings/" || true
          sudo chown -R "$(id -u)" "$OUT"
          du -sh "$OUT"/*
          cd "$OUT"
          git init -q -b unity-refs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Unity reference assemblies"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" unity-refs
